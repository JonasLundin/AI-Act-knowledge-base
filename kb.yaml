# Bundle manifest read by tools/validate.py. Add a category or section here before using it in wiki/.
manifest_version: 1
okf_version: '0.2'
slug: ai-act
name: AI Act Knowledge Base
description: Regulation (EU) 2024/1689 (AI Act) as amended by Regulation (EU) 2026/1744, its secondary legislation, standards,
  guidance, authorities and national implementation.
extension_key: x-ai-act
categories:
- law
- requirement
- guidance
- standard
- role
- procedure
- authority
- jurisdiction
- timeline
- glossary
- system
sections:
- path: law
  title: Law
  description: Regulation (EU) 2024/1689 article by article, its annexes, the amending Regulation (EU) 2026/1744, delegated
    and implementing acts, and interacting EU law.
- path: obligations
  title: Obligations
  description: Role and lifecycle views of the regulation's requirements.
- path: systems
  title: Systems
  description: The regulation's risk categories and the systems that fall into each.
- path: standards
  title: Standards
  description: Harmonised standards, the standardisation request to CEN and CENELEC, JTC 21 work items, common specifications,
    and supporting international standards recorded as identifiers and links.
- path: guidance
  title: Guidance
  description: Official non-binding guidance.
- path: authorities
  title: Authorities
  description: 'EU-level governance: the AI Office, the European Artificial Intelligence Board, the Scientific Panel, the
    Advisory Forum, notified bodies as a role, and the market surveillance framework.'
- path: jurisdictions
  title: Jurisdictions
  description: Each Member State's market surveillance and notifying authorities, regulatory sandboxes, penalties and implementing
    measures, plus EEA status.
- path: timeline
  title: Timeline
  description: Entry into force, prohibited practices, GPAI obligations, Article 50 transparency, the deferred high-risk dates
    under Regulation (EU) 2026/1744, standardisation and review milestones.
- path: glossary
  title: Glossary
  description: Terms defined in Article 3 of Regulation (EU) 2024/1689.
